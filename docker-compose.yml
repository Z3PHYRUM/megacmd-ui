services:
  megacmd-ui:
    build: .
    container_name: megacmd-ui
    ports:
      - "8085:8085"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - megacmd-ui-data:/data
    environment:
      - MEGACMD_CONTAINER=megacmd
    restart: unless-stopped

volumes:
  megacmd-ui-data:
